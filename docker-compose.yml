services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: specbox
      MYSQL_USER: specbox
      MYSQL_PASSWORD: specbox-local
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
